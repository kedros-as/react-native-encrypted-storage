buildscript {
  ext.EncryptedStorage_kotlinVersion = "2.1.20"

  def getExtOrDefault = { name ->
    rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['EncryptedStorage_' + name]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties['EncryptedStorage_' + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties['EncryptedStorage_' + name]).toInteger()
}

apply plugin: "com.android.library"
apply plugin: "com.facebook.react"

android {
  namespace "com.emeraldsanto.encryptedstorage"

  compileSdkVersion getExtOrIntegerDefault('compileSdkVersion')

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault('minSdkVersion')
    targetSdkVersion getExtOrIntegerDefault('targetSdkVersion')
    versionCode 50
    versionName "4.0.1"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    abortOnError false
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-android"

  implementation "androidx.security:security-crypto:1.1.0"

  testImplementation "junit:junit:4.13.2"

  androidTestImplementation "androidx.test.ext:junit:1.2.1"
  //noinspection GradleDependency
  androidTestImplementation "org.mockito:mockito-android:5.14.2"
  androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"
}
